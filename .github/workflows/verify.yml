name: Verify Puskar AI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scrpit.js
      - run: node --check server.mjs
      - run: npm test
      - name: Ensure no browser-embedded credentials
        run: |
          if grep -En 'sk-proj-|sk-[A-Za-z0-9_-]{20,}|Authorization:[[:space:]]*`Bearer' scrpit.js index.html; then
            echo "Possible browser-embedded credential"; exit 1
          fi
          test "$(grep -c '<html' index.html)" -eq 1
          grep -q 'src="scrpit.js"' index.html
